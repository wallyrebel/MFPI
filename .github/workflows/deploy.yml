name: Deploy site

# Pushing to main does not by itself put anything on mississippifootballrankings.com.
# This workflow is what makes a merged code change go live. Ranking data deploys
# separately from update-rankings.yml, right after it commits a new snapshot.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'reports/**'
      - '.github/workflows/update-rankings.yml'
      # The weekly rankings job pushes these and deploys them itself. Without
      # this, every data commit would deploy twice, from two racing workflows.
      - 'data/current/**'
      - 'data/2026/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfpi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # A queued deployment must include rankings committed while it waited.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: npm run lint

      - name: Test site display and ad-eligibility logic
        run: npm run test:site

      # Blocking audit findings stop the deploy; warnings are reported only.
      - name: Audit the snapshot being deployed
        run: python -m mfpi.audit --snapshot data/current

      - name: Check Weekly Analysis review metadata
        run: python -m mfpi.editorial validate

      - name: Build
        env:
          # AdSense settings are public values configured as repository
          # variables (Settings > Secrets and variables > Actions > Variables).
          # Unset variables leave advertising off. See ADSENSE.md.
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADS_ENABLED: ${{ vars.NEXT_PUBLIC_ADS_ENABLED }}
          NEXT_PUBLIC_GOOGLE_CMP: ${{ vars.NEXT_PUBLIC_GOOGLE_CMP }}
          NEXT_PUBLIC_ADSENSE_SLOT_RANKINGS_TOP: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_RANKINGS_TOP }}
          NEXT_PUBLIC_ADSENSE_SLOT_RANKINGS_BOTTOM: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_RANKINGS_BOTTOM }}
          NEXT_PUBLIC_ADSENSE_SLOT_TEAM_MID: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_TEAM_MID }}
          NEXT_PUBLIC_ADSENSE_SLOT_TEAM_BOTTOM: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_TEAM_BOTTOM }}
          NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_MID: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_MID }}
          NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_BOTTOM: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_BOTTOM }}
          NEXT_PUBLIC_ADS_TXT_EXTRA: ${{ vars.NEXT_PUBLIC_ADS_TXT_EXTRA }}
          NEXT_PUBLIC_PUBLISHER_NAME: ${{ vars.NEXT_PUBLIC_PUBLISHER_NAME }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config dist/server/wrangler.json
