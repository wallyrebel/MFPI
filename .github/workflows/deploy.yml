name: Deploy site

# Pushing to main does not by itself put anything on mississippifootballrankings.com.
# This workflow is what makes a merged code change go live. Ranking data deploys
# separately from update-rankings.yml, right after it commits a new snapshot.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/update-rankings.yml'
      # The weekly rankings job pushes these and deploys them itself. Without
      # this, every data commit would deploy twice, from two racing workflows.
      - 'data/current/**'
      - 'data/2026/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfpi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # A queued deployment must include rankings committed while it waited.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config dist/server/wrangler.json
