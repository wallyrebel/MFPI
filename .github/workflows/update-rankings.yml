name: Update MFPI rankings

on:
  schedule:
    # 11:00 a.m. America/Chicago every Tuesday, matching the weekly cutoff in
    # mfpi/config.py. The two must stay in step: run before the cutoff and the
    # job recomputes the week that is already published.
    - cron: "0 11 * * 2"
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      corrected:
        description: Publish an audited correction if this week already exists
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mfpi-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install site dependencies
        run: npm ci

      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: mfpi-source-cache-${{ github.run_id }}
          restore-keys: |
            mfpi-source-cache-

      - name: Test ranking engine
        run: python -m pytest -q -p no:cacheprovider

      - name: Pull data and calculate rankings
        if: ${{ github.event_name == 'schedule' || !inputs.corrected }}
        run: python calculate_rankings.py --live --skip-existing

      - name: Pull data and publish an audited correction
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.corrected }}
        run: python calculate_rankings.py --live --corrected

      - name: Build Cloudflare site
        run: npm run build

      - name: Preserve fetched source cache
        if: ${{ always() && hashFiles('data/cache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: mfpi-source-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ranking-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/drafts/**/validation.json
            data/current/validation.json
          if-no-files-found: ignore

      - name: Commit updated ranking snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current data/2026
          if git diff --cached --quiet; then
            echo "No ranking data changed."
            exit 0
          fi
          git commit -m "Update MFPI weekly rankings"
          git push

      # The rankings and every team page are built from the snapshot above, so
      # the site keeps serving last week's numbers until a deploy runs. dist/ is
      # already the fresh build from the "Build Cloudflare site" step.
      # Always deploy, even if the week already exists: a retry must recover a
      # failed deployment after the snapshot was successfully committed.
      - name: Deploy updated rankings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config dist/server/wrangler.json
